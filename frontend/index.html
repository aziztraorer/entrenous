<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Entre Nous - A real-time conversation game between two players" />
    <meta name="theme-color" content="#1f2937" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Entre Nous" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Le manifeste est injecté par vite-plugin-pwa (manifest.webmanifest) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Crimson+Text:ital@0;1&display=swap" rel="stylesheet">
    <title>Entre Nous - Conversation Game</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Capture TÔT l'événement beforeinstallprompt : il peut se déclencher
      // avant le montage de l'app Vue, et un listener ajouté trop tard le raterait.
      window.__installPromptEvent = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__installPromptEvent = e;
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
